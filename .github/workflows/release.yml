name: Build native releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 4.6.0)
        required: true
        default: '4.6.0'
        type: string
      draft_release:
        description: Upload all successful builds to a draft GitHub Release
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

env:
  SCOREMANAGER_VERSION: ${{ inputs.version || github.ref_name }}
  PYTHONUTF8: '1'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            java_arch: x64
          - target: linux-x64
            runner: ubuntu-22.04
            java_arch: x64
          - target: macos-arm64
            runner: macos-15
            java_arch: aarch64
          - target: macos-x64
            runner: macos-15-intel
            java_arch: x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_arch }}
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libasound2 fonts-noto-cjk
      - name: Build, regression test, and test startup (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1440x900x24' python scripts/build.py --test --smoke
      - name: Build, regression test, and test startup (Windows and macOS)
        if: runner.os != 'Linux'
        run: python scripts/build.py --test --smoke
      - name: Upload packaged applications
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/*-BUILD-INFO.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload startup diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: build/**/native-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    name: Assemble draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify every archive and upload to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/draft_release.py
